<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dc2626" />
    <!-- Square PN brand mark, cropped from the monogram in logo.png. Google (and
         browser tabs) require a SQUARE favicon; the full 716x348 wordmark was
         rejected, which is why search showed the generic globe. Rendered on solid
         white because the mark is black/red and would disappear on a dark tab. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Site-wide metadata defaults. <div id="root"> is empty until React runs,
         so these are the only tags a scraper that does not execute JavaScript
         will ever see. Every tag marked data-default-meta is removed the moment
         the first <Seo> mounts (src/components/seo/Seo.jsx), handing metadata
         over to the route without leaving a duplicate behind.

         Deliberately absent: rel="canonical". A static canonical here would
         point every URL on the site at the homepage for any crawler that
         stopped before hydration, which is far worse than having none. -->
    <title data-default-meta>Men's Bottom-wear Wholesale Maker in Ahmedabad | Pronoun Jeans</title>
    <meta data-default-meta name="description" content="Wholesale men&#39;s cargo pants, trousers, formal pants, shorts &amp; boxers from Ahmedabad. Size sets, 1-set MOQ, pan-India dispatch." />
    <meta data-default-meta property="og:type" content="website" />
    <meta data-default-meta property="og:site_name" content="Pronoun Jeans" />
    <meta data-default-meta property="og:title" content="Men's Bottom-wear Wholesale Maker in Ahmedabad | Pronoun Jeans" />
    <meta data-default-meta property="og:description" content="Wholesale men&#39;s cargo pants, trousers, formal pants, shorts &amp; boxers from Ahmedabad. Size sets, 1-set MOQ, pan-India dispatch." />
    <meta data-default-meta property="og:url" content="https://www.pronounjeans.com/" />
    <meta data-default-meta property="og:image" content="https://www.pronounjeans.com/og-default.jpg" />
    <meta data-default-meta property="og:image:width" content="1200" />
    <meta data-default-meta property="og:image:height" content="630" />
    <meta data-default-meta property="og:locale" content="en_IN" />
    <meta data-default-meta name="twitter:card" content="summary_large_image" />
    <meta data-default-meta name="twitter:title" content="Men's Bottom-wear Wholesale Maker in Ahmedabad | Pronoun Jeans" />
    <meta data-default-meta name="twitter:description" content="Wholesale men&#39;s cargo pants, trousers, formal pants, shorts &amp; boxers from Ahmedabad. Size sets, 1-set MOQ, pan-India dispatch." />
    <meta data-default-meta name="twitter:image" content="https://www.pronounjeans.com/og-default.jpg" />

    <!-- Static entity markup — the Organization and LocalBusiness nodes.

         Not marked data-default-meta: it describes the business, not the page,
         so it stays valid on every route and must survive hydration.
         Page-level JSON-LD is passed to <Seo> as children.

         Built from BUSINESS (src/content/seoContent.js) at build time by the
         entity-jsonld plugin in vite.config.js and substituted for the comment
         below. It used to be typed out here, which made this the third copy of
         the address and phone in the repo and the second set of opening hours. -->
    <!--entity-jsonld-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
